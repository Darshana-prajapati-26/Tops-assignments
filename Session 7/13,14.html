<!-- 13.
Log the type and coordinates (clientX, clientY) of any mouse event (click, mouseover, etc.) when the user interacts with a Flipkart-style 'Add to Cart' button, using the event object.<br><br><em><strong>Hint:</strong> Access event.type, event.clientX, and event.clientY inside your event handler.</em>
14.
Log the type and coordinates (clientX, clientY) of any 
mouse event (click, mouseover, etc.) when the user interacts with 
a Flipkart-style 'Add to Cart' button, using the event object.
<br><br><em><strong>Hint:</strong> Access event.type, event.clientX, 
and event.clientY inside your event handler.</em> -->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q13 & Q14 - Event Object on Add to Cart</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f5f5f5; }
    h2 { color: #2874f0; }
    #cart-btn {
      padding: 12px 28px;
      background: #ff9f00;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    #cart-btn:hover { background: #e68900; }
    #event-log {
      margin-top: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      max-width: 420px;
      font-size: 14px;
      min-height: 60px;
    }
    .log-entry { margin: 4px 0; color: #333; }
    .log-entry span { font-weight: bold; color: #2874f0; }
  </style>
</head>
<body>

  <h2>🛒 Flipkart - Add to Cart Button</h2>
  <button id="cart-btn">Add to Cart</button>

  <div id="event-log"><em style="color:#aaa;">Interact with the button to see event info...</em></div>

  <script>
    // Q13 & Q14: Log event.type, event.clientX, event.clientY for click and mouseover
    const btn = document.getElementById("cart-btn");
    const log = document.getElementById("event-log");

    function logEvent(event) {
      console.log(`Type: ${event.type} | X: ${event.clientX} | Y: ${event.clientY}`);

      // Clear placeholder text on first interaction
      if (log.querySelector("em")) log.innerHTML = "";

      const entry = document.createElement("p");
      entry.classList.add("log-entry");
      entry.innerHTML = `Type: <span>${event.type}</span> &nbsp;|&nbsp; X: <span>${event.clientX}</span> &nbsp;|&nbsp; Y: <span>${event.clientY}</span>`;
      log.prepend(entry);
    }

    btn.addEventListener("click", logEvent);
    btn.addEventListener("mouseover", logEvent);
    btn.addEventListener("mouseout", logEvent);
  </script>
</body>
</html>
