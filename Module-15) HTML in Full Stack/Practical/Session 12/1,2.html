<!--
  Q1:
  Use fetch() to get a list of posts from https://jsonplaceholder.typicode.com/posts
  and display the first 5 post titles in the browser console.

  Q2:
  Use fetch() to get a list of posts from https://jsonplaceholder.typicode.com/posts
  and display the first 5 post titles in the browser console.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q1 & Q2 - fetch() First 5 Post Titles</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #fafafa; }
    h2 { color: #333; }
    #output { margin-top: 16px; }
    .post-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 8px 0;
      max-width: 560px;
      font-size: 15px;
    }
    .post-num { font-weight: bold; color: #2874f0; margin-right: 8px; }
  </style>
</head>
<body>

  <h2>Q1 & Q2: fetch() – First 5 Post Titles</h2>
  <div class="question-box" style="background:#fff8e1;border-left:5px solid #f9a825;border-radius:8px;padding:14px 18px;margin-bottom:20px;max-width:680px;font-family:Arial,sans-serif;">
    <h3 style="margin:0 0 8px;color:#e65100;font-size:15px;">Q1 &amp; Q2</h3>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#333;">Use <code>fetch()</code> to get a list of posts from <code>https://jsonplaceholder.typicode.com/posts</code> and display the first 5 post titles in the browser console.</p>
  </div>
  <p>Open the browser console to see the logged output.</p>
  <div id="output">Loading...</div>

  <script>
    // Q1 & Q2: fetch posts and display first 5 titles in console + page
    fetch("https://jsonplaceholder.typicode.com/posts")
      .then(response => response.json())
      .then(posts => {
        const first5 = posts.slice(0, 5);
        const container = document.getElementById("output");
        container.innerHTML = "";

        first5.forEach((post, index) => {
          console.log(`${index + 1}. ${post.title}`);

          const card = document.createElement("div");
          card.classList.add("post-card");
          card.innerHTML = `<span class="post-num">#${index + 1}</span>${post.title}`;
          container.appendChild(card);
        });
      })
      .catch(err => console.error("Error:", err));
  </script>
</body>
</html>
