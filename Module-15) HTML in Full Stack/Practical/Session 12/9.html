<!--
  Q9:
  Chain fetch() promises to fetch user data from https://jsonplaceholder.typicode.com/users,
  parse the JSON response, and then display all user emails in a single alert box
  separated by commas.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q9 - Chained fetch() User Emails Alert</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #fafafa; }
    h2 { color: #333; }
    button {
      padding: 10px 22px;
      background: #2874f0;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #1a5ec4; }
    #emails-list { margin-top: 16px; font-size: 15px; }
    .email-item { padding: 6px 0; border-bottom: 1px solid #eee; max-width: 360px; }
  </style>
</head>
<body>

  <h2>Q9: Chained fetch() – User Emails</h2>
  <div class="question-box" style="background:#fff8e1;border-left:5px solid #f9a825;border-radius:8px;padding:14px 18px;margin-bottom:20px;max-width:680px;font-family:Arial,sans-serif;">
    <h3 style="margin:0 0 8px;color:#e65100;font-size:15px;">Q9</h3>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#333;">Chain <code>fetch()</code> promises to fetch user data from <code>https://jsonplaceholder.typicode.com/users</code>, parse the JSON response, and then display all user emails in a single alert box separated by commas.</p>
  </div>
  <div id="emails-list"></div>

  <script>
    // Q9: Fetch users, parse JSON, display all emails in alert + on page
    function showEmails() {
      fetch("https://jsonplaceholder.typicode.com/users")
        .then(response => response.json())
        .then(users => {
          const emails = users.map(u => u.email);

          // Display in alert as comma-separated
          alert(emails.join(", "));

          // Also display on page
          const container = document.getElementById("emails-list");
          container.innerHTML = "<strong>User Emails:</strong>";
          emails.forEach(email => {
            const div = document.createElement("div");
            div.classList.add("email-item");
            div.textContent = "✉️ " + email;
            container.appendChild(div);
          });
        })
        .catch(err => console.error("Error:", err));
    }
  </script>
</body>
</html>
