<!--
  Q3:
  Use fetch() to GET a list of posts from https://jsonplaceholder.typicode.com/posts
  and display the first 5 post titles in the browser console.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - fetch() GET Posts Console</title>
  <style>
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      max-width: 680px; font-family: Arial, sans-serif;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q3</h3>
    <p>Use <code>fetch()</code> to GET a list of posts from <code>https://jsonplaceholder.typicode.com/posts</code> and display the first 5 post titles in the browser console.</p>
  </div>
  <h2>Q3: fetch() GET – First 5 Post Titles (Console)</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q3: GET posts, log first 5 titles to console
    fetch("https://jsonplaceholder.typicode.com/posts")
      .then(response => response.json())
      .then(posts => {
        posts.slice(0, 5).forEach((post, i) => {
          console.log(`${i + 1}. ${post.title}`);
        });
      })
      .catch(err => console.error("Fetch error:", err));
  </script>
</body>
</html>
