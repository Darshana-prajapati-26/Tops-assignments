<!--
  Q9:
  Build an array called cart containing 4 objects, each representing a Flipkart product
  with properties: productName, price, and quantity. Write a loop to display each product's
  name and total price (price × quantity) in the console.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q9 - Flipkart Cart Total Price</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f5f5f5; }
    h2 { color: #2874f0; }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th {
      background: #2874f0;
      color: #fff;
      padding: 12px 16px;
      text-align: left;
    }
    td { padding: 10px 16px; border-bottom: 1px solid #eee; }
    tr:last-child td { border-bottom: none; }
    .total-row td { font-weight: bold; background: #e3f2fd; color: #1a237e; }
  </style>
</head>
<body>

  <h2>🛒 Flipkart Cart</h2>
  <div class="question-box" style="background:#fff8e1;border-left:5px solid #f9a825;border-radius:8px;padding:14px 18px;margin-bottom:20px;max-width:680px;font-family:Arial,sans-serif;">
    <h3 style="margin:0 0 8px;color:#e65100;font-size:15px;">Q9</h3>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#333;">Build an array called <code>cart</code> containing 4 objects, each representing a Flipkart product with properties: <code>productName</code>, <code>price</code>, and <code>quantity</code>. Write a loop to display each product's name and total price (<code>price × quantity</code>) in the console.</p>
  </div>
  <table id="cart-table">
    <thead>
      <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="cart-body"></tbody>
  </table>

  <script>
    // Q9: Cart array of 4 product objects, loop to show name and total (price × quantity)
    const cart = [
      { productName: "Wireless Headphones", price: 1999, quantity: 2 },
      { productName: "Mechanical Keyboard", price: 3499, quantity: 1 },
      { productName: "USB-C Hub", price: 899, quantity: 3 },
      { productName: "Laptop Stand", price: 1299, quantity: 1 }
    ];

    const tbody = document.getElementById("cart-body");
    let grandTotal = 0;

    for (const item of cart) {
      const lineTotal = item.price * item.quantity;
      grandTotal += lineTotal;

      console.log(`${item.productName} — Total: ₹${lineTotal}`);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.productName}</td>
        <td>₹${item.price}</td>
        <td>${item.quantity}</td>
        <td>₹${lineTotal}</td>
      `;
      tbody.appendChild(tr);
    }

    // Grand total row
    const totalRow = document.createElement("tr");
    totalRow.classList.add("total-row");
    totalRow.innerHTML = `<td colspan="3">Grand Total</td><td>₹${grandTotal}</td>`;
    tbody.appendChild(totalRow);
  </script>
</body>
</html>
