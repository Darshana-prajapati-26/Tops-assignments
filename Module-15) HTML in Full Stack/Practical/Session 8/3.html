  Q3:
  Create an array called playlists with 3 objects, each representing a Spotify playlist
  with properties: name, numberOfSongs, and genre. Log the entire array to the console.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - Playlists Array with Genre</title>
  <style>
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      max-width: 680px; font-family: Arial, sans-serif;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q3</h3>
    <p>Create an array called <code>playlists</code> with 3 objects, each representing a Spotify playlist with properties: <code>name</code>, <code>numberOfSongs</code>, and <code>genre</code>. Log the entire array to the console.</p>
  </div>
  <h2>Q3: Playlists Array – name, numberOfSongs, genre</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q3: Array of 3 playlist objects with name, numberOfSongs, and genre
    const playlists = [
      { name: "Chill Vibes", numberOfSongs: 25, genre: "Lo-fi" },
      { name: "Workout Beats", numberOfSongs: 40, genre: "Hip-Hop" },
      { name: "Bollywood Hits", numberOfSongs: 55, genre: "Bollywood" }
    ];

    console.log(playlists);
  </script>
</body>
</html>
