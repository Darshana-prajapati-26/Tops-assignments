<!--
  Q6:
  Use the push() method to add a new playlist object to your playlists array with your
  favorite genre. Then, use pop() to remove the last playlist and log the updated array
  after each operation.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q6 - push() then pop()</title>
  <style>
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      max-width: 680px; font-family: Arial, sans-serif;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q6</h3>
    <p>Use the <code>push()</code> method to add a new playlist object to your <code>playlists</code> array with your favourite genre. Then, use <code>pop()</code> to remove the last playlist and log the updated array after each operation.</p>
  </div>
  <h2>Q6: push() a new playlist, then pop() the last one</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q6: push() a new playlist with favourite genre, then pop() it off and log after each
    const playlists = [
      { name: "Chill Vibes", creator: "Rahul", numberOfSongs: 25 },
      { name: "Workout Beats", creator: "Priya", numberOfSongs: 40 },
      { name: "Bollywood Hits", creator: "Amit", numberOfSongs: 55 }
    ];

    // push new playlist
    playlists.push({ name: "Indie Feels", creator: "Rohan", numberOfSongs: 18, genre: "Indie" });
    console.log("After push():");
    console.log(playlists);

    // pop last playlist
    const removed = playlists.pop();
    console.log("\nRemoved by pop():", removed);
    console.log("\nAfter pop():");
    console.log(playlists);
  </script>
</body>
</html>
