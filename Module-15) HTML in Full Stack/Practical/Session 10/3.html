<!--
  Q3:
  Create a template literal that displays a welcome message like Spotify:
  'Hello, ${userName}! You have ${playlistCount} playlists.'
  Assign userName and playlistCount variables and log the message to the console.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - Spotify Welcome Template Literal</title>
  <style>
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      max-width: 680px; font-family: Arial, sans-serif;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q3</h3>
    <p>Create a template literal that displays a welcome message like: <code>'Hello, ${userName}! You have ${playlistCount} playlists.'</code> Assign <code>userName</code> and <code>playlistCount</code> variables and log the message to the console.</p>
  </div>
  <h2>Q3: Spotify Welcome – Template Literal</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q3: Template literal with userName and playlistCount variables
    const userName = "Rahul";
    const playlistCount = 8;

    const message = `Hello, ${userName}! You have ${playlistCount} playlists.`;
    console.log(message);
  </script>
</body>
</html>
