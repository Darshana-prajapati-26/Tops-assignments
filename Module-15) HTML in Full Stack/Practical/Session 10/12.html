<!--
  Q12:
  Use the spread operator to combine two arrays: your favorite Zomato dishes and your
  favorite Swiggy dishes, into a single array called allDishes, then log allDishes.
  Hint: Use [...array1, ...array2] syntax.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q12 - Spread Operator Zomato & Swiggy Dishes</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #fff8f0; }
    h2 { color: #e23744; }
    ul { font-size: 16px; padding-left: 20px; }
    li { margin: 6px 0; }
  </style>
</head>
<body>

  <h2>Q12: Spread Operator – Zomato + Swiggy Dishes</h2>
  <div class="question-box" style="background:#fff8e1;border-left:5px solid #f9a825;border-radius:8px;padding:14px 18px;margin-bottom:20px;max-width:680px;font-family:Arial,sans-serif;">
    <h3 style="margin:0 0 8px;color:#e65100;font-size:15px;">Q12</h3>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#333;">Use the spread operator to combine two arrays: your favourite Zomato dishes and your favourite Swiggy dishes, into a single array called <code>allDishes</code>, then log <code>allDishes</code>.<br><em style="font-size:14px;color:#555;"><strong>Hint:</strong> Use <code>[...array1, ...array2]</code> syntax.</em></p>
  </div>
  <ul id="dish-list"></ul>

  <script>
    // Q12: Spread two dish arrays into one allDishes array
    const zomatoDishes = ["Butter Chicken", "Biryani", "Paneer Tikka"];
    const swiggyDishes  = ["Masala Dosa", "Chole Bhature", "Vada Pav"];

    const allDishes = [...zomatoDishes, ...swiggyDishes];

    console.log("allDishes:", allDishes);

    const list = document.getElementById("dish-list");
    allDishes.forEach(dish => {
      const li = document.createElement("li");
      li.textContent = "🍽️ " + dish;
      list.appendChild(li);
    });
  </script>
</body>
</html>
