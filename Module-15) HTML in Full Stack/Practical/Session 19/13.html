<!--
  Q13:
  Add an Edit feature: when the Edit button is clicked for a restaurant, pre-fill the
  form with that restaurant's details, allow the user to update them, and save the changes
  back to the array and UI.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q13 - Restaurant Edit Feature</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #fff8f0; }
    h2 { color: #e23744; }
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 24px; max-width: 680px;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
    .form-box { background: #fff; border-radius: 12px; padding: 22px 26px; max-width: 460px; box-shadow: 0 2px 8px rgba(0,0,0,0.09); margin-bottom: 28px; border-top: 4px solid #e23744; transition: border-color 0.3s; }
    .form-box.editing { border-color: #f9a825; }
    .form-box h3 { color: #e23744; margin-top: 0; transition: color 0.3s; }
    .form-box.editing h3 { color: #f9a825; }
    label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
    input, select { width: 100%; padding: 9px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    .btn-submit { flex: 1; padding: 10px; background: #e23744; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    .btn-submit.editing { background: #f9a825; color: #333; }
    .btn-cancel { padding: 10px 18px; background: #f4f4f4; color: #555; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; display: none; }
    #err-msg { color: #e23744; font-size: 13px; margin-top: 8px; }
    .restaurant-card { background: #fff; border-radius: 10px; padding: 14px 18px; max-width: 540px; margin: 10px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; }
    .restaurant-card.active { border: 2px solid #f9a825; }
    .r-info { flex: 1; }
    .r-name { font-weight: bold; font-size: 15px; }
    .r-meta { font-size: 13px; color: #777; margin-top: 3px; }
    .rating { color: #f9a825; font-weight: bold; }
    .card-btns { display: flex; gap: 6px; }
    .btn-edit { background: #fff3cd; color: #e65100; border: 1px solid #f9a825; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
    .btn-del  { background: #fdecea; color: #c62828; border: 1px solid #e53935; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Q13: Restaurant Edit Feature</h2>
  <div class="question-box">
    <h3>Q13</h3>
    <p>When the Edit button is clicked, pre-fill the form with that restaurant's details,
    allow the user to update them, and save changes back to the array and UI.</p>
  </div>

  <div class="form-box" id="form-box">
    <h3 id="form-title">🍽️ Add Restaurant</h3>
    <label>Restaurant Name</label>
    <input type="text" id="r-name" placeholder="e.g. Biryani Palace" />
    <label>Cuisine</label>
    <select id="r-cuisine">
      <option value="">Select Cuisine</option>
      <option>Indian</option><option>Chinese</option><option>Italian</option>
      <option>Mexican</option><option>Japanese</option>
    </select>
    <label>Rating (1–5)</label>
    <input type="number" id="r-rating" min="1" max="5" step="0.1" placeholder="e.g. 4.5" />
    <div class="btn-row">
      <button class="btn-submit" id="submit-btn" onclick="submitForm()">+ Add Restaurant</button>
      <button class="btn-cancel" id="cancel-btn" onclick="cancelEdit()">Cancel</button>
    </div>
    <p id="err-msg"></p>
  </div>

  <h3 style="color:#e23744;">🍴 Restaurants</h3>
  <div id="restaurant-list"><p style="color:#aaa;font-style:italic;">No restaurants yet — add one above!</p></div>

  <script>
    // Q13: Edit feature — pre-fill form on Edit click, save back to array at same index
    const restaurants = [
      { name: "Biryani Palace", cuisine: "Indian",   rating: 4.5 },
      { name: "Dragon Wok",     cuisine: "Chinese",  rating: 4.2 },
      { name: "Pizza Hub",      cuisine: "Italian",  rating: 4.0 }
    ];
    let editIndex = -1;

    function submitForm() {
      const name    = document.getElementById("r-name").value.trim();
      const cuisine = document.getElementById("r-cuisine").value;
      const rating  = parseFloat(document.getElementById("r-rating").value);
      const err     = document.getElementById("err-msg");

      if (!name || !cuisine || isNaN(rating) || rating < 1 || rating > 5) {
        err.textContent = "All fields required. Rating: 1–5.";
        return;
      }
      err.textContent = "";

      if (editIndex >= 0) {
        // Save changes back to array at the same index
        restaurants[editIndex] = { name, cuisine, rating };
        cancelEdit();
      } else {
        restaurants.push({ name, cuisine, rating });
        clearForm();
      }
      renderList();
    }

    function editRestaurant(i) {
      editIndex = i;
      // Pre-fill form with existing values
      document.getElementById("r-name").value    = restaurants[i].name;
      document.getElementById("r-cuisine").value = restaurants[i].cuisine;
      document.getElementById("r-rating").value  = restaurants[i].rating;
      document.getElementById("form-title").textContent = "✏️ Edit Restaurant";
      document.getElementById("submit-btn").textContent = "💾 Save Changes";
      document.getElementById("submit-btn").classList.add("editing");
      document.getElementById("cancel-btn").style.display = "block";
      document.getElementById("form-box").classList.add("editing");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderList(); // highlight editing card
    }

    function cancelEdit() {
      editIndex = -1;
      clearForm();
      document.getElementById("form-title").textContent = "🍽️ Add Restaurant";
      document.getElementById("submit-btn").textContent = "+ Add Restaurant";
      document.getElementById("submit-btn").classList.remove("editing");
      document.getElementById("cancel-btn").style.display = "none";
      document.getElementById("form-box").classList.remove("editing");
      renderList();
    }

    function clearForm() {
      document.getElementById("r-name").value   = "";
      document.getElementById("r-cuisine").value = "";
      document.getElementById("r-rating").value  = "";
    }

    function deleteRestaurant(i) {
      restaurants.splice(i, 1);
      if (editIndex === i) cancelEdit();
      else renderList();
    }

    function renderList() {
      const container = document.getElementById("restaurant-list");
      container.innerHTML = "";
      if (restaurants.length === 0) {
        container.innerHTML = '<p style="color:#aaa;font-style:italic;">No restaurants yet!</p>';
        return;
      }
      restaurants.forEach((r, i) => {
        const card = document.createElement("div");
        card.classList.add("restaurant-card");
        if (i === editIndex) card.classList.add("active");
        card.innerHTML = `
          <div class="r-info">
            <div class="r-name">🍴 ${r.name}</div>
            <div class="r-meta">${r.cuisine} &nbsp;|&nbsp; <span class="rating">⭐ ${r.rating}</span></div>
          </div>
          <div class="card-btns">
            <button class="btn-edit" onclick="editRestaurant(${i})">✏️ Edit</button>
            <button class="btn-del"  onclick="deleteRestaurant(${i})">🗑️ Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    renderList();
  </script>
</body>
</html>
