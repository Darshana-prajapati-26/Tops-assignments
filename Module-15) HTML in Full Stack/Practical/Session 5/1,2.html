1.
Create a function declaration called createSpotifyButton(label, color)
 that returns an HTML button element with the given label and 
 background color, and display it on the page.

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q1 & Q2 - createSpotifyButton</title>
</head>
<body>
  <h2>Q1 & Q2: createSpotifyButton – Function Declaration</h2>

  <script>
    // Q1 & Q2: Function declaration that creates and returns a styled button
    function createSpotifyButton(label, color) {
      const btn = document.createElement("button");
      btn.textContent = label;
      btn.style.backgroundColor = color;
      btn.style.color = "#fff";
      btn.style.padding = "10px 20px";
      btn.style.margin = "8px";
      btn.style.border = "none";
      btn.style.borderRadius = "25px";
      btn.style.fontSize = "16px";
      btn.style.cursor = "pointer";
      return btn;
    }

    document.body.appendChild(createSpotifyButton("Play", "#1DB954"));
    document.body.appendChild(createSpotifyButton("Pause", "#191414"));
    document.body.appendChild(createSpotifyButton("Next", "#535353"));
  </script>
</body>
</html>
