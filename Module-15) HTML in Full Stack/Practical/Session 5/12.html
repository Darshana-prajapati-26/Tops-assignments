<!-- 12.
Refactor the following code to use an arrow function instead of a function 
declaration: <br><br>function double(x) { return x * 2; } -->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q12 - Refactor to Arrow Function</title>
</head>
<body>
  <h2>Q12: Refactor double() to an Arrow Function</h2>

  <script>
    // Original (for reference):
    // function double(x) { return x * 2; }

    // Q12: Refactored as an arrow function
    const double = (x) => x * 2;

    const numbers = [3, 7, 12, 25, 50];

    numbers.forEach((n) => {
      const p = document.createElement("p");
      p.textContent = `double(${n}) = ${double(n)}`;
      document.body.appendChild(p);
    });
  </script>
</body>
</html>
