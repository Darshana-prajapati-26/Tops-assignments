<!-- 3.
Declare a function expression called getGreeting that takes a user's 
name as a parameter and returns a message like 'Hello, Rahul!'. -->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - getGreeting Function Expression</title>
</head>
<body>
  <h2>Q3: getGreeting – Function Expression</h2>

  <script>
    // Q3: Function expression that returns a greeting message
    const getGreeting = function (name) {
      return `Hello, ${name}!`;
    };

    console.log(getGreeting("Rahul"));
    console.log(getGreeting("Priya"));

    // Display on page
    const p1 = document.createElement("p");
    p1.textContent = getGreeting("Rahul");
    document.body.appendChild(p1);

    const p2 = document.createElement("p");
    p2.textContent = getGreeting("Priya");
    document.body.appendChild(p2);
  </script>
</body>
</html>
