<!--
  Q12:
  Extend the Playlist class by adding a method addSong(songName) that adds a new song
  to the songs array. Demonstrate by adding two songs and displaying the updated playlist.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q12 - Playlist addSong() Method</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #121212; color: #fff; }
    h2 { color: #1DB954; }
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      max-width: 680px;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
    .input-row { display: flex; gap: 10px; margin-bottom: 16px; }
    input {
      padding: 9px 14px; font-size: 15px; border: none;
      border-radius: 6px; background: #282828; color: #fff; width: 260px;
    }
    button {
      padding: 9px 20px; background: #1DB954; color: #fff;
      border: none; border-radius: 25px; font-size: 15px; cursor: pointer;
    }
    button:hover { background: #17a047; }
    .playlist-card {
      background: #282828; border-radius: 10px; padding: 16px 20px;
      max-width: 420px; margin-top: 10px;
    }
    .playlist-card h3 { color: #1DB954; margin: 0 0 10px; }
    .song-item { padding: 6px 0; border-bottom: 1px solid #383838; color: #ccc; font-size: 15px; }
    .song-item:last-child { border-bottom: none; }
    .count-badge {
      display: inline-block; background: #1DB954; color: #000;
      border-radius: 20px; padding: 2px 10px; font-size: 13px;
      font-weight: bold; margin-left: 8px;
    }
  </style>
</head>
<body>

  <h2>Q12: Playlist – addSong() Method</h2>
  <div class="question-box">
    <h3>Q12</h3>
    <p>Extend the <code>Playlist</code> class by adding a method <code>addSong(songName)</code>
    that adds a new song to the songs array. Demonstrate by adding two songs and displaying
    the updated playlist.</p>
  </div>

  <div class="input-row">
    <input type="text" id="song-input" placeholder="Enter song name..." />
    <button onclick="addSong()">Add Song</button>
  </div>

  <div class="playlist-card" id="playlist-display"></div>

  <script>
    // Q12: Playlist class with addSong() method
    class Playlist {
      constructor(name, songs) {
        this.name = name;
        this.songs = songs;
      }

      addSong(songName) {
        this.songs.push(songName);
        console.log(`Added: ${songName}. Total songs: ${this.songs.length}`);
      }

      displayPlaylist() {
        const header = `${this.name}`;
        const songList = this.songs.map((s, i) => `${i + 1}. ${s}`).join("\n");
        return { header, songList, count: this.songs.length };
      }
    }

    const myPlaylist = new Playlist("Chill Vibes", [
      "Kesariya",
      "Tum Hi Ho"
    ]);

    // Demonstrate adding two songs on load
    myPlaylist.addSong("Raataan Lambiyan");
    myPlaylist.addSong("Tera Ban Jaunga");

    function renderPlaylist() {
      const { header, songList, count } = myPlaylist.displayPlaylist();
      const container = document.getElementById("playlist-display");
      container.innerHTML = `
        <h3>🎵 ${header} <span class="count-badge">${count} songs</span></h3>
        ${myPlaylist.songs.map((s, i) =>
          `<div class="song-item">🎶 ${i + 1}. ${s}</div>`
        ).join("")}
      `;
    }

    function addSong() {
      const input = document.getElementById("song-input");
      const name = input.value.trim();
      if (!name) return;
      myPlaylist.addSong(name);
      renderPlaylist();
      input.value = "";
    }

    renderPlaylist();
  </script>
</body>
</html>
