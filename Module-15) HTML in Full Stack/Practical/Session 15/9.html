<!--
  Q9:
  Create a class FlipkartProduct with properties: title, price, and rating. Add a method
  displayDetails() that prints all details in a formatted string like
  'Redmi Note 12 Pro - Rs.18999 - 4.5 stars'.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q9 - FlipkartProduct displayDetails()</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f5f5f5; }
    h2 { color: #2874f0; }
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      max-width: 680px;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
    .product-card {
      background: #fff; border-radius: 10px; padding: 16px 22px;
      max-width: 420px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin: 10px 0; font-size: 15px; color: #212121;
      border-left: 4px solid #2874f0;
    }
  </style>
</head>
<body>

  <h2>Q9: FlipkartProduct – displayDetails() Method</h2>
  <div class="question-box">
    <h3>Q9</h3>
    <p>Create a class <code>FlipkartProduct</code> with properties: <code>title</code>,
    <code>price</code>, and <code>rating</code>. Add a method <code>displayDetails()</code>
    that prints all details in a formatted string like
    <code>'Redmi Note 12 Pro - ₹18999 - 4.5⭐'</code>.</p>
  </div>

  <div id="product-list"></div>

  <script>
    // Q9: FlipkartProduct class with displayDetails() method
    class FlipkartProduct {
      constructor(title, price, rating) {
        this.title = title;
        this.price = price;
        this.rating = rating;
      }

      displayDetails() {
        return `${this.title} - ₹${this.price} - ${this.rating}⭐`;
      }
    }

    const products = [
      new FlipkartProduct("Redmi Note 12 Pro", 18999, 4.5),
      new FlipkartProduct("Apple AirPods Pro", 24990, 4.7),
      new FlipkartProduct("Samsung Galaxy Tab", 32999, 4.3)
    ];

    const container = document.getElementById("product-list");
    products.forEach(p => {
      const details = p.displayDetails();
      console.log(details);

      const card = document.createElement("div");
      card.classList.add("product-card");
      card.textContent = details;
      container.appendChild(card);
    });
  </script>
</body>
</html>
