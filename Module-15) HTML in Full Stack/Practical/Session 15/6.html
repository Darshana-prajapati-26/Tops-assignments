<!--
  Q6:
  Add a method getSongCount() to the Playlist class that returns the total number of
  songs in the playlist. Call this method on your instance and display the result.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q6 - getSongCount() Method</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #121212; color: #fff; }
    h2 { color: #1DB954; }
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      max-width: 680px;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
    .result-box {
      background: #282828; border-radius: 10px; padding: 20px 24px;
      max-width: 380px; margin-top: 16px; font-size: 18px;
    }
    .count { color: #1DB954; font-size: 36px; font-weight: bold; }
    .label { color: #aaa; font-size: 14px; margin-top: 4px; }
  </style>
</head>
<body>

  <h2>Q6: Playlist – getSongCount() Method</h2>
  <div class="question-box">
    <h3>Q6</h3>
    <p>Add a method <code>getSongCount()</code> to the <code>Playlist</code> class that returns
    the total number of songs in the playlist. Call this method on your instance and display
    the result.</p>
  </div>

  <div class="result-box" id="result-box">Loading...</div>

  <script>
    // Q6: Playlist class with getSongCount() method
    class Playlist {
      constructor(name, songs) {
        this.name = name;
        this.songs = songs;
      }

      getSongCount() {
        return this.songs.length;
      }
    }

    const myPlaylist = new Playlist("Workout Beats", [
      "Eye of the Tiger",
      "Lose Yourself",
      "Believer",
      "Thunder",
      "Stronger"
    ]);

    const count = myPlaylist.getSongCount();
    console.log(`${myPlaylist.name} has ${count} songs.`);

    document.getElementById("result-box").innerHTML = `
      <div class="count">${count}</div>
      <div class="label">songs in "${myPlaylist.name}"</div>
    `;
  </script>
</body>
</html>
