<!--
  Q1:
  Declare a JavaScript class named Playlist that has a constructor accepting two parameters:
  name and songs (an array). Create an instance for a Spotify playlist called 'Chill Vibes'
  with 3 song names.

  Q2:
  Declare a JavaScript class named Playlist that has a constructor accepting two parameters:
  name and songs (an array). Create an instance for a Spotify playlist called 'Chill Vibes'
  with 3 song names.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q1 & Q2 - Playlist Class</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #121212; color: #fff; }
    h2 { color: #1DB954; }
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      max-width: 680px;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
    .card {
      background: #282828; border-radius: 10px; padding: 16px 20px;
      max-width: 400px; margin-top: 16px;
    }
    .card h3 { color: #1DB954; margin: 0 0 8px; }
    .card li { margin: 4px 0; color: #ccc; }
  </style>
</head>
<body>

  <h2>Q1 &amp; Q2: Playlist Class – Constructor</h2>
  <div class="question-box">
    <h3>Q1 &amp; Q2</h3>
    <p>Declare a JavaScript class named <code>Playlist</code> that has a constructor accepting
    two parameters: <code>name</code> and <code>songs</code> (an array). Create an instance for
    a Spotify playlist called <code>'Chill Vibes'</code> with 3 song names.</p>
  </div>

  <div class="card" id="playlist-card"></div>

  <script>
    // Q1 & Q2: Playlist class with constructor
    class Playlist {
      constructor(name, songs) {
        this.name = name;
        this.songs = songs;
      }
    }

    // Create an instance
    const chillVibes = new Playlist("Chill Vibes", [
      "Kesariya",
      "Tum Hi Ho",
      "Raataan Lambiyan"
    ]);

    console.log(chillVibes);

    // Display on page
    const card = document.getElementById("playlist-card");
    card.innerHTML = `
      <h3>🎵 ${chillVibes.name}</h3>
      <ul>
        ${chillVibes.songs.map(s => `<li>🎶 ${s}</li>`).join("")}
      </ul>
    `;
  </script>
</body>
</html>
