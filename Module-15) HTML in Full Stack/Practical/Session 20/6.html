<!--
  Q6:
  Create a simple form for adding a new playlist (name, description) like in Spotify.
  Test each field by leaving it empty and submitting, then add basic UI validation to
  show an error message if any field is left blank.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q6 - Playlist Form with Validation</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .question-box { background: #fff8e1; border-left: 5px solid #f9a825; padding: 12px 16px; margin-bottom: 18px; max-width: 660px; }
    .question-box h3 { margin: 0 0 6px; color: #e65100; }
    .question-box p { margin: 0; font-size: 14px; }
    input, textarea { display: block; padding: 8px; font-size: 14px; width: 300px; margin: 6px 0; }
    .err { color: red; font-size: 13px; display: block; }
    button { padding: 9px 20px; font-size: 14px; margin-top: 10px; cursor: pointer; }
    #success { color: green; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q6</h3>
    <p>Create a playlist form (name, description). Leave fields empty and submit to test
    validation. Show an error message if any field is blank.</p>
  </div>

  <h2>Q6: Add Playlist Form – Validation</h2>

  <form onsubmit="return handleSubmit(event)">
    <label>Playlist Name</label>
    <input type="text" id="pl-name" placeholder="e.g. Chill Vibes" />
    <span class="err" id="name-err"></span>

    <label>Description</label>
    <textarea id="pl-desc" rows="3" placeholder="Describe your playlist..."></textarea>
    <span class="err" id="desc-err"></span>

    <button type="submit">Create Playlist</button>
  </form>
  <p id="success"></p>

  <script>
    // Q6: Show error below each blank field, only submit if all filled
    function handleSubmit(e) {
      e.preventDefault();

      const name = document.getElementById("pl-name").value.trim();
      const desc = document.getElementById("pl-desc").value.trim();
      let valid = true;

      document.getElementById("name-err").textContent = "";
      document.getElementById("desc-err").textContent = "";
      document.getElementById("success").textContent  = "";

      if (!name) {
        document.getElementById("name-err").textContent = "Playlist name is required.";
        valid = false;
      }
      if (!desc) {
        document.getElementById("desc-err").textContent = "Description is required.";
        valid = false;
      }

      if (valid) {
        document.getElementById("success").textContent = '✅ Playlist "' + name + '" created!';
        document.getElementById("pl-name").value = "";
        document.getElementById("pl-desc").value = "";
      }
    }
  </script>
</body>
</html>
