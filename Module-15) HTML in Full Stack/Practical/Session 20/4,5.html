<!--
  Q4:
  Create a login form with email and password fields and add basic UI validation: show an
  error message if either field is left empty when the user clicks the Login button.
  Hint: Use simple state checks and conditionally render error messages below each input.

  Q5:
  Create a login form with email and password fields and add basic UI validation: show an
  error message if either field is left empty when the user clicks the Login button.
  Hint: Use simple state checks and conditionally render error messages below each input.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q4 & Q5 - Login Form with Validation</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .question-box { background: #fff8e1; border-left: 5px solid #f9a825; padding: 12px 16px; margin-bottom: 18px; max-width: 660px; }
    .question-box h3 { margin: 0 0 6px; color: #e65100; }
    .question-box p { margin: 0; font-size: 14px; }
    .err { color: red; font-size: 13px; }
    input { display: block; margin: 6px 0; padding: 8px; font-size: 14px; width: 280px; }
    button { padding: 9px 20px; font-size: 14px; margin-top: 10px; cursor: pointer; }
    #success { color: green; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q4 &amp; Q5</h3>
    <p>Create a login form with email and password fields. Show an error message if either
    field is left empty when the Login button is clicked.<br>
    <em><strong>Hint:</strong> Conditionally show error messages below each input.</em></p>
  </div>

  <h2>Q4 &amp; Q5: Login Form – UI Validation</h2>

  <form onsubmit="return handleLogin(event)">
    <label>Email</label>
    <input type="text" id="email" placeholder="Enter email" />
    <span class="err" id="email-err"></span>

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" />
    <span class="err" id="pass-err"></span>

    <button type="submit">Login</button>
  </form>
  <p id="success"></p>

  <script>
    // Q4 & Q5: Show inline error if field is empty
    function handleLogin(e) {
      e.preventDefault();

      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      let valid = true;

      document.getElementById("email-err").textContent = "";
      document.getElementById("pass-err").textContent  = "";
      document.getElementById("success").textContent   = "";

      if (!email) {
        document.getElementById("email-err").textContent = "Email is required.";
        valid = false;
      }
      if (!password) {
        document.getElementById("pass-err").textContent = "Password is required.";
        valid = false;
      }

      if (valid) {
        document.getElementById("success").textContent = "✅ Login successful!";
      }
    }
  </script>
</body>
</html>
