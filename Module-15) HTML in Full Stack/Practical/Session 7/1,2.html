<!--
  Q1 & Q2:
  Create an HTML file with a button labeled 'Add to Playlist' and use the onclick event
  to display an alert saying 'Song added!' when the button is clicked.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q1 & Q2 - onclick Alert</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #121212; color: #fff; }
    h2 { color: #1DB954; }
    button {
      padding: 10px 24px;
      background: #1DB954;
      color: #fff;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #17a047; }
  </style>
</head>
<body>

  <h2>🎵 My Playlist</h2>
  <button onclick="alert('Song added!')">Add to Playlist</button>

</body>
</html>
