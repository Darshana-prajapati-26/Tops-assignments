<!-- 
9.
Build a function getBadge(followers) that returns 'Verified Creator ⭐' if followers is 1000 or more, otherwise returns 'Regular User'. Use the ternary operator to implement this logic.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q9 - getBadge</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        h2 { color: #333; }
        .output { background: #fff; border-left: 4px solid #FF5722; padding: 12px 16px; margin-top: 16px; border-radius: 4px; }
        .output p { margin: 6px 0; font-size: 15px; }
        .label { font-weight: bold; color: #555; }
        .verified { color: #1DA1F2; font-weight: bold; }
        .regular  { color: #999; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Q9 - getBadge(followers)</h2>
    <div class="output" id="output"></div>

    <script>
        // Ternary operator: condition ? valueIfTrue : valueIfFalse
        function getBadge(followers) {
            return followers >= 1000 ? "Verified Creator ⭐" : "Regular User";
        }

        let r1 = getBadge(1000);
        let r2 = getBadge(500);
        let r3 = getBadge(2500);

        console.log("getBadge(1000):", r1);
        console.log("getBadge(500):", r2);
        console.log("getBadge(2500):", r3);

        document.getElementById("output").innerHTML = `
            <p><span class="label">getBadge(1000):</span> <span class="verified">${r1}</span></p>
            <p><span class="label">getBadge(500):</span>  <span class="regular">${r2}</span></p>
            <p><span class="label">getBadge(2500):</span> <span class="verified">${r3}</span></p>
        `;
    </script>
</body>
</html>
