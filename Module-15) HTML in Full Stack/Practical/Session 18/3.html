<!--
  Q3:
  Create a JavaScript file that defines an array of 5 songs (each with title, artist, and
  duration), then use console.table() to display the array in a formatted table in the
  browser console.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - console.table() Songs</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #121212; color: #fff; }
    h2 { color: #1DB954; }
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; max-width: 680px;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
    p.note { color: #aaa; font-size: 14px; }
    table { border-collapse: collapse; max-width: 560px; margin-top: 12px; width: 100%; }
    th { background: #1DB954; color: #000; padding: 10px 14px; text-align: left; font-size: 14px; }
    td { padding: 9px 14px; border-bottom: 1px solid #383838; font-size: 14px; color: #ccc; }
    tr:hover td { background: #282828; }
  </style>
</head>
<body>
  <h2>Q3: console.table() – Song List</h2>
  <div class="question-box">
    <h3>Q3</h3>
    <p>Define an array of 5 songs (each with <code>title</code>, <code>artist</code>, and
    <code>duration</code>), then use <code>console.table()</code> to display the array in
    a formatted table in the browser console.</p>
  </div>

  <p class="note">Open DevTools Console (F12) to see the <code>console.table()</code> output.</p>

  <table>
    <thead><tr><th>#</th><th>Title</th><th>Artist</th><th>Duration</th></tr></thead>
    <tbody id="song-table-body"></tbody>
  </table>

  <script>
    // Q3: Array of 5 songs, displayed with console.table()
    const songs = [
      { title: "Kesariya",         artist: "Arijit Singh",    duration: "4:28" },
      { title: "Tum Hi Ho",        artist: "Arijit Singh",    duration: "4:37" },
      { title: "Raataan Lambiyan", artist: "Jubin Nautiyal",  duration: "3:58" },
      { title: "Believer",         artist: "Imagine Dragons", duration: "3:24" },
      { title: "Lose Yourself",    artist: "Eminem",          duration: "5:20" }
    ];

    // console.table() displays a clean table in DevTools Console
    console.table(songs);

    // Also render on page
    const tbody = document.getElementById("song-table-body");
    songs.forEach((song, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${i + 1}</td><td>🎵 ${song.title}</td><td>${song.artist}</td><td>${song.duration}</td>`;
      tbody.appendChild(tr);
    });
  </script>
</body>
</html>
