<!-- 10.
Given an array of objects representing Flipkart products (each with name and price), use a for-of loop to print only the product names.
11.
Given an array of objects representing Flipkart products 
(each with name and price), use a for-of loop to print only the 
product names. -->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q10 & Q11 - Flipkart Products for-of loop</title>
</head>
<body>
  <h2>Q10 & Q11: Flipkart Products – for-of loop (print names)</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q10 & Q11: Array of objects (name, price), print only product names using for-of
    const products = [
      { name: "Laptop", price: 45000 },
      { name: "Mobile", price: 15000 },
      { name: "Headphones", price: 2000 },
      { name: "Watch", price: 8000 },
      { name: "Keyboard", price: 1500 }
    ];

    for (const product of products) {
      console.log(product.name);
    }
  </script>
</body>
</html>
