3.
Create an array called playlist containing 5 of your favorite 
song names and use a for loop to print each song name 
in the console.

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - Playlist for loop</title>
</head>
<body>
  <h2>Q3: Playlist – for loop</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q3: Array of 5 favourite songs, print each with a for loop
    const playlist = ["Kesariya", "Tum Hi Ho", "Raataan Lambiyan", "bin tere", "pehli dafa"];

    for (let i = 0; i < playlist.length; i++) {
      console.log(playlist[i]);
    }
  </script>
</body>
</html>
