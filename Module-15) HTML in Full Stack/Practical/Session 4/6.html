<!-- 6.
Given an array of Instagram usernames, use a while loop to print each
username in uppercase. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q6 - Instagram usernames while loop</title>
</head>
<body>
  <h2>Q6: Instagram Usernames – while loop (uppercase)</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q6: Array of Instagram usernames, print each in uppercase using a while loop
    const usernames = ["@virat.kohli", "@rohitsharma45", "@msdhoni", "@harbhajan_singh", "@sachin_rt"];

    let i = 0;
    while (i < usernames.length) {
      console.log(usernames[i].toUpperCase());
      i++;
    }
  </script>
</body>
</html>
