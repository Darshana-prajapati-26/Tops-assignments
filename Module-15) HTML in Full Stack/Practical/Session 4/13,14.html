Create an array of your 5 most-used WhatsApp contacts (just names as strings). Use the forEach method to print a message for each: 'Sending hi to [name] on WhatsApp!'.<br><br><em><strong>Hint:</strong> Use an arrow function as the callback for forEach.</em>
14.
Create an array of your 5 most-used WhatsApp contacts 
(just names as strings). Use the forEach method to print a 
message for each: 'Sending hi to [name] on WhatsApp!'.
<br><br><em><strong>Hint:</strong> Use an arrow function

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q13 & Q14 - WhatsApp Contacts forEach</title>
</head>
<body>
  <h2>Q13 & Q14: WhatsApp Contacts – forEach with arrow function</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q13 & Q14: Array of 5 WhatsApp contacts, print a message for each using forEach
    const contacts = ["Amit", "Priya", "Rohan", "Sneha", "Vikram"];

    contacts.forEach((name) => {
      console.log("Sending hi to " + name + " on WhatsApp!");
    });
  </script>
</body>
</html>
