
<!-- 1.
Create an array called favApps with the names of 5 apps you use daily (like Instagram, Zomato, Paytm, etc.)
and use a for loop to print each app name in the console.
2.
Create an array called favApps with the names of 5 apps you use daily (like Instagram, Zomato, Paytm, etc.) and use a for loop to print each app name in the console. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q1 & Q2 - favApps for loop</title>
</head>
<body>
  <h2>Q1 & Q2: favApps – for loop</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q1 & Q2: Array of 5 daily-use apps, print each with a for loop
    const favApps = ["Instagram", "Zomato", "Paytm", "YouTube", "WhatsApp"];

    for (let i = 0; i < favApps.length; i++) {
      console.log(favApps[i]);
    }
  </script>
</body>
</html>
