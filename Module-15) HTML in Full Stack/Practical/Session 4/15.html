<!-- Use the forEach method to loop through an array of cricket 
 team names (e.g., 'MI', 'CSK', 'RCB', 'GT') and print 'Go [team]!' 
 for each.<br><br><em><strong>Hint:</strong> forEach takes a callback 
function with the current element as a parameter.</em> -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q15 - IPL Teams forEach</title>
</head>
<body>
  <h2>Q15: IPL Teams – forEach</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q15: Array of IPL teams, print 'Go [team]!' for each using forEach
    const teams = ["MI", "CSK", "RCB", "GT"];

    teams.forEach((team) => {
      console.log("Go " + team + "!");
    });
  </script>
</body>
</html>
