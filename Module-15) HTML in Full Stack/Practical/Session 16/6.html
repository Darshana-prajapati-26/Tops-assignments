<!--
  Q6:
  Use map() to transform an array of Flipkart product objects (each with name and price)
  into an array of strings formatted as 'Product: [name], Price: Rs.[price]'.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q6 - map() Formatted Product Strings</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f5f5f5; }
    h2 { color: #2874f0; }
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; max-width: 680px;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
    .string-item {
      background: #fff; border-left: 4px solid #2874f0; border-radius: 6px;
      padding: 10px 16px; margin: 8px 0; max-width: 520px;
      font-family: monospace; font-size: 14px; color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <h2>Q6: map() – Formatted Product Strings</h2>
  <div class="question-box">
    <h3>Q6</h3>
    <p>Use <code>map()</code> to transform an array of Flipkart product objects (each with
    <code>name</code> and <code>price</code>) into an array of strings formatted as
    <code>'Product: [name], Price: ₹[price]'</code>.</p>
  </div>

  <h3 style="color:#2874f0;">Formatted Strings:</h3>
  <div id="output-list"></div>

  <script>
    // Q6: map() — format each product object into a descriptive string
    const products = [
      { name: "Redmi Note 12 Pro", price: 18999 },
      { name: "Boat Rockerz 255", price: 1299 },
      { name: "Noise Smartwatch", price: 3499 },
      { name: "Samsung Galaxy Tab", price: 32999 },
      { name: "HP Laptop 15s", price: 45999 }
    ];

    const formattedStrings = products.map(
      p => `Product: ${p.name}, Price: ₹${p.price}`
    );

    console.log("Formatted strings:", formattedStrings);

    const container = document.getElementById("output-list");
    formattedStrings.forEach(str => {
      const div = document.createElement("div");
      div.classList.add("string-item");
      div.textContent = str;
      container.appendChild(div);
    });
  </script>
</body>
</html>
