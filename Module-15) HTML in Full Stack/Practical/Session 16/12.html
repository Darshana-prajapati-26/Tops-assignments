<!--
  Q12:
  Given an array of Zomato restaurant objects, each with a cuisine property, use find()
  to get the first restaurant that serves 'Chinese' cuisine.
  Hint: Use the find() method and check the cuisine property inside the callback.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q12 - find() Chinese Restaurant</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #fff8f0; }
    h2 { color: #e23744; }
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; max-width: 680px;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
    .restaurant-row {
      background: #fff; border-radius: 8px; padding: 10px 16px;
      margin: 6px 0; max-width: 500px; display: flex;
      justify-content: space-between; align-items: center;
      border-left: 4px solid #ccc; font-size: 15px;
    }
    .restaurant-row.found { border-left-color: #e23744; background: #fff3f0; }
    .cuisine { font-size: 13px; color: #777; }
    .found-card {
      background: #e23744; color: #fff; border-radius: 12px;
      padding: 18px 22px; max-width: 380px; margin-top: 20px;
    }
    .found-card h3 { margin: 0 0 8px; }
    .found-card p { margin: 4px 0; opacity: 0.9; }
  </style>
</head>
<body>
  <h2>Q12: find() – First Chinese Restaurant</h2>
  <div class="question-box">
    <h3>Q12</h3>
    <p>Given an array of Zomato restaurant objects, each with a <code>cuisine</code> property,
    use <code>find()</code> to get the first restaurant that serves <code>'Chinese'</code> cuisine.<br>
    <em><strong>Hint:</strong> Use the <code>find()</code> method and check the <code>cuisine</code>
    property inside the callback.</em></p>
  </div>

  <h3 style="color:#e23744;">All Restaurants:</h3>
  <div id="restaurant-list"></div>
  <div id="found-box"></div>

  <script>
    // Q12: find() — first restaurant with cuisine === 'Chinese'
    const restaurants = [
      { name: "Biryani Palace", cuisine: "Indian" },
      { name: "Pizza Hub", cuisine: "Italian" },
      { name: "Dragon Wok", cuisine: "Chinese" },
      { name: "Sushi Garden", cuisine: "Japanese" },
      { name: "Panda Express", cuisine: "Chinese" }
    ];

    const chineseRestaurant = restaurants.find(r => r.cuisine === "Chinese");

    console.log("First Chinese restaurant:", chineseRestaurant);

    // Display all restaurants
    const list = document.getElementById("restaurant-list");
    restaurants.forEach(r => {
      const row = document.createElement("div");
      row.classList.add("restaurant-row");
      if (r === chineseRestaurant) row.classList.add("found");
      row.innerHTML = `<span>🍽️ ${r.name}</span>
                       <span class="cuisine">${r.cuisine}</span>`;
      list.appendChild(row);
    });

    // Show result
    const foundBox = document.getElementById("found-box");
    if (chineseRestaurant) {
      foundBox.innerHTML = `
        <div class="found-card">
          <h3>🎯 First Chinese restaurant found:</h3>
          <p>🏠 <strong>${chineseRestaurant.name}</strong></p>
          <p>🍜 Cuisine: ${chineseRestaurant.cuisine}</p>
        </div>
      `;
    }
  </script>
</body>
</html>
