<!--
  Q3:
  Create an array of your top 3 favorite food delivery apps (like Zomato, Swiggy, Domino's),
  convert it to a JSON string using JSON.stringify(), and log the result to the console.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - JSON.stringify() Food Apps Array</title>
  <style>
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      max-width: 680px; font-family: Arial, sans-serif;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q3</h3>
    <p>Create an array of your top 3 favourite food delivery apps (like Zomato, Swiggy, Domino's), convert it to a JSON string using <code>JSON.stringify()</code>, and log the result to the console.</p>
  </div>
  <h2>Q3: JSON.stringify() – Favourite Food Delivery Apps</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q3: Array of top 3 food delivery apps converted to JSON string
    const foodApps = ["Zomato", "Swiggy", "Domino's"];

    const jsonString = JSON.stringify(foodApps);
    console.log("JSON String:");
    console.log(jsonString);
  </script>
</body>
</html>
