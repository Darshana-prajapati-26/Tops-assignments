<!--
  Q4:
  Write a function that takes a JSON string representing a list of favorite YouTube channels
  and returns an array of channel names using JSON.parse().

  Q5:
  Write a function that takes a JSON string representing a list of favorite YouTube channels
  and returns an array of channel names using JSON.parse().
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q4 & Q5 - JSON.parse() YouTube Channels</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #fff8f0; }
    h2 { color: #ff0000; }
    ul { font-size: 16px; }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <h2>Q4 & Q5: JSON.parse() – YouTube Channels</h2>
  <div class="question-box" style="background:#fff8e1;border-left:5px solid #f9a825;border-radius:8px;padding:14px 18px;margin-bottom:20px;max-width:680px;font-family:Arial,sans-serif;">
    <h3 style="margin:0 0 8px;color:#e65100;font-size:15px;">Q4 &amp; Q5</h3>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#333;">Write a function that takes a JSON string representing a list of favourite YouTube channels and returns an array of channel names using <code>JSON.parse()</code>.</p>
  </div>
  <ul id="channel-list"></ul>

  <script>
    // Q4 & Q5: Function that takes a JSON string and returns an array of channel names
    function getChannelNames(jsonString) {
      const channels = JSON.parse(jsonString);
      return channels.map(ch => ch.name);
    }

    const jsonData = JSON.stringify([
      { name: "TED", subscribers: "19M" },
      { name: "Veritasium", subscribers: "14M" },
      { name: "Kurzgesagt", subscribers: "21M" },
      { name: "Fireship", subscribers: "2.8M" }
    ]);

    const names = getChannelNames(jsonData);
    console.log("Channel names:", names);

    // Display on page
    const list = document.getElementById("channel-list");
    names.forEach(name => {
      const li = document.createElement("li");
      li.textContent = "▶ " + name;
      list.appendChild(li);
    });
  </script>
</body>
</html>
