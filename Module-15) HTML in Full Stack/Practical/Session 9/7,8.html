<!--
  Q7:
  Build a simple web page where users can add their top 3 favorite Zomato restaurants to a
  list and save it to localStorage using localStorage.setItem(). When the page reloads, the
  list should automatically load from localStorage and display.

  Q8:
  Build a simple web page where users can add their top 3 favorite Zomato restaurants to a
  list and save it to localStorage using localStorage.setItem(). When the page reloads, the
  list should automatically load from localStorage and display.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q7 & Q8 - Zomato Favourites with localStorage</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #fff8f0; }
    h2 { color: #e23744; }
    .input-row { display: flex; gap: 10px; margin-bottom: 16px; }
    input {
      padding: 9px 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 240px;
    }
    .btn {
      padding: 9px 18px;
      background: #e23744;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn:hover { background: #c0303c; }
    .restaurant-card {
      background: #fff;
      border: 1px solid #e23744;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 8px 0;
      max-width: 340px;
      font-size: 16px;
    }
    #empty-msg { color: #aaa; font-style: italic; }
  </style>
</head>
<body>

  <h2>🍽️ My Favourite Restaurants</h2>
  <div class="question-box" style="background:#fff8e1;border-left:5px solid #f9a825;border-radius:8px;padding:14px 18px;margin-bottom:20px;max-width:680px;font-family:Arial,sans-serif;">
    <h3 style="margin:0 0 8px;color:#e65100;font-size:15px;">Q7 &amp; Q8</h3>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#333;">Build a simple web page where users can add their top 3 favourite Zomato restaurants to a list and save it to <code>localStorage</code> using <code>localStorage.setItem()</code>. When the page reloads, the list should automatically load from <code>localStorage</code> and display.</p>
  </div>
    <input type="text" id="restaurant-input" placeholder="Enter restaurant name..." />
    <button class="btn" onclick="addRestaurant()">Add</button>
  </div>

  <div id="restaurant-list"></div>

  <script>
    const KEY = "favouriteRestaurants";

    function getRestaurants() {
      const data = localStorage.getItem(KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveRestaurants(arr) {
      localStorage.setItem(KEY, JSON.stringify(arr));
    }

    function renderRestaurants() {
      const list = document.getElementById("restaurant-list");
      const restaurants = getRestaurants();
      list.innerHTML = "";

      if (restaurants.length === 0) {
        list.innerHTML = '<p id="empty-msg">No favourites saved yet.</p>';
        return;
      }

      restaurants.forEach(name => {
        const card = document.createElement("div");
        card.classList.add("restaurant-card");
        card.textContent = "🍴 " + name;
        list.appendChild(card);
      });
    }

    function addRestaurant() {
      const input = document.getElementById("restaurant-input");
      const name = input.value.trim();
      if (!name) return;

      const restaurants = getRestaurants();
      restaurants.push(name);
      saveRestaurants(restaurants);
      renderRestaurants();
      input.value = "";
    }

    // Load on page start
    renderRestaurants();
  </script>
</body>
</html>
