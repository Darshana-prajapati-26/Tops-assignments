<!--
  Q12:
  Simulate a Flipkart-style wishlist: create an array of 3 products (each with name and
  price), save it in localStorage as 'wishlist', then reload the page and display the
  wishlist items by reading and parsing the data from localStorage.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q12 - Flipkart Wishlist localStorage</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f5f5f5; }
    h2 { color: #2874f0; }
    .product-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px 18px;
      margin: 10px 0;
      max-width: 340px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .product-name { font-size: 16px; font-weight: bold; }
    .product-price { color: #388e3c; font-weight: bold; }
    #empty-msg { color: #aaa; font-style: italic; }
  </style>
</head>
<body>

  <h2>💙 Flipkart Wishlist</h2>
  <div class="question-box" style="background:#fff8e1;border-left:5px solid #f9a825;border-radius:8px;padding:14px 18px;margin-bottom:20px;max-width:680px;font-family:Arial,sans-serif;">
    <h3 style="margin:0 0 8px;color:#e65100;font-size:15px;">Q12</h3>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#333;">Simulate a Flipkart-style wishlist: create an array of 3 products (each with <code>name</code> and <code>price</code>), save it in <code>localStorage</code> as <code>'wishlist'</code>, then reload the page and display the wishlist items by reading and parsing the data from <code>localStorage</code>.</p>
  </div>

  <script>
    const KEY = "wishlist";

    // Save wishlist to localStorage on first load if not already saved
    if (!localStorage.getItem(KEY)) {
      const wishlist = [
        { name: "Wireless Headphones", price: 1999 },
        { name: "Mechanical Keyboard", price: 3499 },
        { name: "Laptop Stand", price: 1299 }
      ];
      localStorage.setItem(KEY, JSON.stringify(wishlist));
    }

    // Read and display from localStorage
    function renderWishlist() {
      const container = document.getElementById("wishlist-container");
      const data = localStorage.getItem(KEY);

      if (!data) {
        container.innerHTML = '<p id="empty-msg">Wishlist is empty.</p>';
        return;
      }

      const wishlist = JSON.parse(data);
      container.innerHTML = "";

      wishlist.forEach(item => {
        const card = document.createElement("div");
        card.classList.add("product-card");
        card.innerHTML = `
          <span class="product-name">💙 ${item.name}</span>
          <span class="product-price">₹${item.price}</span>
        `;
        container.appendChild(card);
      });
    }

    renderWishlist();
  </script>
</body>
</html>
