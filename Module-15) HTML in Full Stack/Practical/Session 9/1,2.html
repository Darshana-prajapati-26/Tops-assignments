<!--
  Q1:
  Create a JavaScript object representing a Flipkart-style product with name, price, and
  rating fields, then convert it to a JSON string using JSON.stringify() and log the result.

  Q2:
  Create a JavaScript object representing a Flipkart-style product with name, price, and
  rating fields, then convert it to a JSON string using JSON.stringify() and log the result.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q1 & Q2 - JSON.stringify() Product</title>
  <style>
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
      max-width: 680px; font-family: Arial, sans-serif;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q1 &amp; Q2</h3>
    <p>Create a JavaScript object representing a Flipkart-style product with <code>name</code>, <code>price</code>, and <code>rating</code> fields, then convert it to a JSON string using <code>JSON.stringify()</code> and log the result.</p>
  </div>
  <h2>Q1 & Q2: JSON.stringify() – Flipkart Product</h2>
  <p>Open the browser console to see the output.</p>

  <script>
    // Q1 & Q2: Create a product object and convert to JSON string
    const product = {
      name: "Wireless Headphones",
      price: 1999,
      rating: 4.5
    };

    const jsonString = JSON.stringify(product);
    console.log("JSON String:");
    console.log(jsonString);

    // Pretty-print with indentation
    console.log("\nPretty JSON:");
    console.log(JSON.stringify(product, null, 2));
  </script>
</body>
</html>
