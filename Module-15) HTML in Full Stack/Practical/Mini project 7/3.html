<!--
  Q3:
  Create a JavaScript function addPlaylistLink(linkObj) that adds a new music playlist
  link (with name and URL) to an array and saves the updated array to LocalStorage under
  the key 'myPlaylists'.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - addPlaylistLink() → LocalStorage 'myPlaylists'</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .question-box { background: #fff8e1; border-left: 5px solid #f9a825; padding: 12px 16px; margin-bottom: 18px; max-width: 660px; }
    .question-box h3 { margin: 0 0 6px; color: #e65100; }
    .question-box p { margin: 0; font-size: 14px; }
    input { display: block; padding: 8px; font-size: 14px; width: 280px; margin: 6px 0; }
    button { padding: 9px 20px; font-size: 14px; margin-top: 8px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; font-size: 13px; border-radius: 4px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q3</h3>
    <p>Create a function <code>addPlaylistLink(linkObj)</code> that adds a music playlist
    link (with <code>name</code> and <code>URL</code>) to an array and saves the updated
    array to LocalStorage under the key <code>'myPlaylists'</code>.</p>
  </div>

  <h2>Q3: addPlaylistLink() → 'myPlaylists'</h2>

  <label>Name</label>
  <input type="text" id="pl-name" placeholder="e.g. Chill Mix" />
  <label>URL</label>
  <input type="text" id="pl-url" placeholder="e.g. https://open.spotify.com/..." />
  <button onclick="handleAdd()">Add Playlist Link</button>
  <p id="msg" style="color:green;"></p>

  <h3>myPlaylists (LocalStorage):</h3>
  <pre id="output">[]</pre>

  <script>
    // Q3: addPlaylistLink — key is 'myPlaylists'
    function addPlaylistLink(linkObj) {
      const existing = JSON.parse(localStorage.getItem("myPlaylists") || "[]");
      existing.push(linkObj);
      localStorage.setItem("myPlaylists", JSON.stringify(existing));
      return existing;
    }

    function handleAdd() {
      const name = document.getElementById("pl-name").value.trim();
      const url  = document.getElementById("pl-url").value.trim();
      if (!name || !url) return;

      const updated = addPlaylistLink({ name, url });
      document.getElementById("msg").textContent = "✅ Saved to 'myPlaylists' in LocalStorage.";
      document.getElementById("output").textContent = JSON.stringify(updated, null, 2);
      document.getElementById("pl-name").value = "";
      document.getElementById("pl-url").value  = "";
    }

    const saved = localStorage.getItem("myPlaylists");
    if (saved) document.getElementById("output").textContent = saved;
  </script>
</body>
</html>
