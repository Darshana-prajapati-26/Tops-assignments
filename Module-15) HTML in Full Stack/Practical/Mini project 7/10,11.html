<!--
  Q10:
  Refactor your link editing logic so that both add and edit operations use a single
  reusable function manageLink(linkObj, mode), where mode is either 'add' or 'edit'.
  Constraint: Do not repeat code for LocalStorage updates in both cases.

  Q11:
  Refactor your link editing logic so that both add and edit operations use a single
  reusable function manageLink(linkObj, mode), where mode is either 'add' or 'edit'.
  Constraint: Do not repeat code for LocalStorage updates in both cases.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q10 & Q11 - manageLink(linkObj, mode)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .question-box { background: #fff8e1; border-left: 5px solid #f9a825; padding: 12px 16px; margin-bottom: 18px; max-width: 660px; }
    .question-box h3 { margin: 0 0 6px; color: #e65100; }
    .question-box p { margin: 0; font-size: 14px; }
    input, select { display: block; padding: 8px; font-size: 14px; width: 280px; margin: 6px 0; }
    button { padding: 9px 18px; font-size: 14px; margin-top: 8px; cursor: pointer; margin-right: 6px; }
    pre { background: #f4f4f4; padding: 12px; font-size: 13px; border-radius: 4px; white-space: pre-wrap; }
    .err { color: red; font-size: 13px; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q10 &amp; Q11</h3>
    <p>Refactor so both add and edit use a single function <code>manageLink(linkObj, mode)</code>
    where <code>mode</code> is <code>'add'</code> or <code>'edit'</code>.<br>
    <em><strong>Constraint:</strong> Do not repeat LocalStorage update code in both cases.</em></p>
  </div>

  <h2>Q10 &amp; Q11: manageLink(linkObj, mode)</h2>

  <label>Mode</label>
  <select id="mode">
    <option value="add">add</option>
    <option value="edit">edit</option>
  </select>

  <label>Index (only for edit mode)</label>
  <input type="number" id="link-index" placeholder="e.g. 0" min="0" />

  <label>Name</label>
  <input type="text" id="link-name" placeholder="Playlist name" />

  <label>URL</label>
  <input type="text" id="link-url" placeholder="https://..." />

  <button onclick="handleManage()">Run manageLink()</button>
  <button onclick="seedData()">Seed Data</button>
  <p id="msg" style="color:green;"></p>
  <p class="err" id="err"></p>

  <h3>myPlaylists (LocalStorage):</h3>
  <pre id="output">[]</pre>

  <script>
    // Q10 & Q11: Single reusable function — no repeated LocalStorage code
    function manageLink(linkObj, mode) {
      const playlists = JSON.parse(localStorage.getItem("myPlaylists") || "[]");

      if (mode === "add") {
        playlists.push(linkObj);
      } else if (mode === "edit") {
        if (linkObj.index < 0 || linkObj.index >= playlists.length) return null;
        playlists[linkObj.index] = { name: linkObj.name, url: linkObj.url };
      }

      // ✅ LocalStorage update happens only ONCE — not repeated in each branch
      localStorage.setItem("myPlaylists", JSON.stringify(playlists));
      return playlists;
    }

    function handleManage() {
      const mode  = document.getElementById("mode").value;
      const index = parseInt(document.getElementById("link-index").value);
      const name  = document.getElementById("link-name").value.trim();
      const url   = document.getElementById("link-url").value.trim();
      const err   = document.getElementById("err");

      if (!name || !url) { err.textContent = "Name and URL are required."; return; }
      err.textContent = "";

      const linkObj = mode === "edit" ? { index, name, url } : { name, url };
      const updated = manageLink(linkObj, mode);

      if (updated === null) { err.textContent = "Index out of range."; return; }

      document.getElementById("msg").textContent =
        "✅ manageLink() called with mode='" + mode + "'. LocalStorage updated.";
      document.getElementById("output").textContent = JSON.stringify(updated, null, 2);
    }

    function seedData() {
      const sample = [
        { name: "Chill Mix", url: "https://open.spotify.com/playlist/abc" },
        { name: "Workout",   url: "https://music.youtube.com/playlist?list=xyz" }
      ];
      localStorage.setItem("myPlaylists", JSON.stringify(sample));
      document.getElementById("output").textContent = JSON.stringify(sample, null, 2);
    }

    const saved = localStorage.getItem("myPlaylists");
    if (saved) document.getElementById("output").textContent = saved;
  </script>
</body>
</html>
