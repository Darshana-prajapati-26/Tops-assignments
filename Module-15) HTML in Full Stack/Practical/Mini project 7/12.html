<!--
  Q12:
  Implement a toggleTheme() function that switches between light and dark mode for your
  playlist links page, saving the selected mode in LocalStorage and applying it on next visit.
  Hint: Use document.body.classList and check LocalStorage on page load.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q12 - toggleTheme() Playlist Page</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #fff; color: #000; transition: background 0.3s, color 0.3s; }
    body.dark-mode { background: #1a1a1a; color: #eee; }
    .question-box { background: #fff8e1; border-left: 5px solid #f9a825; padding: 12px 16px; margin-bottom: 18px; max-width: 660px; }
    .question-box h3 { margin: 0 0 6px; color: #e65100; }
    .question-box p { margin: 0; font-size: 14px; }
    pre { background: #f4f4f4; padding: 12px; font-size: 13px; border-radius: 4px; white-space: pre-wrap; }
    body.dark-mode pre { background: #333; color: #eee; }
    button { padding: 9px 20px; font-size: 14px; margin-top: 10px; cursor: pointer; }
    #theme-info { margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="question-box">
    <h3>Q12</h3>
    <p>Implement <code>toggleTheme()</code> that switches light/dark mode for your playlist
    links page, saves the mode to LocalStorage, and applies it on the next visit.<br>
    <em><strong>Hint:</strong> Use <code>document.body.classList</code> and check LocalStorage
    on page load.</em></p>
  </div>

  <h2>Q12: toggleTheme() – Playlist Page</h2>

  <button onclick="toggleTheme()" id="theme-btn">🌙 Switch to Dark Mode</button>
  <p id="theme-info"></p>

  <h3>Sample Playlist Links:</h3>
  <pre id="playlist-display">Loading...</pre>

  <script>
    // Q12: toggleTheme — classList toggle + LocalStorage persist + apply on load
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      updateThemeUI(isDark);
    }

    function updateThemeUI(isDark) {
      document.getElementById("theme-btn").textContent =
        isDark ? "☀️ Switch to Light Mode" : "🌙 Switch to Dark Mode";
      document.getElementById("theme-info").textContent =
        "Theme: " + (isDark ? "Dark" : "Light") + " — saved to localStorage['theme']";
    }

    // Apply on page load — check localStorage
    (function applyThemeOnLoad() {
      const saved = localStorage.getItem("theme");
      if (saved === "dark") {
        document.body.classList.add("dark-mode");
        updateThemeUI(true);
      } else {
        updateThemeUI(false);
      }
    })();

    // Display sample data
    const samplePlaylists = [
      { name: "Chill Mix", url: "https://open.spotify.com/playlist/abc" },
      { name: "Workout Beats", url: "https://music.youtube.com/playlist?list=xyz" }
    ];
    document.getElementById("playlist-display").textContent =
      JSON.stringify(samplePlaylists, null, 2);
  </script>
</body>
</html>
