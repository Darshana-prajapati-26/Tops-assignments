<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M1-A1 | Section B · Task 3 — Live Order Form</title>
  <style>
    :root {
      --primary: #1565c0;
      --accent:  #e53935;
      --green:   #2e7d32;
      --bg:      #f0f4f8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); min-height: 100vh; }

    /* Banner */
    .banner {
      background: linear-gradient(135deg, #1565c0, #1976d2, #42a5f5);
      color: #fff; padding: 28px 36px 24px;
    }
    .banner .tag {
      display: inline-block;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      font-size: 11px; letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 3px 10px; border-radius: 20px; margin-bottom: 10px;
    }
    .banner h1 { font-size: 22px; font-weight: 700; }
    .banner p  { font-size: 13px; opacity: .85; margin-top: 6px; }

    /* Layout */
    .container {
      max-width: 680px; margin: 30px auto; padding: 0 20px 60px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    @media(max-width:580px){ .container{ grid-template-columns:1fr; } }

    /* Cards */
    .card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08); overflow: hidden;
    }
    .card-head {
      background: var(--primary); color: #fff;
      padding: 13px 18px; font-size: 14px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .card-head .icon { font-size: 18px; }
    .card-body { padding: 20px; }

    /* Form elements */
    label {
      display: block; font-size: 13px; font-weight: 600;
      color: #444; margin: 14px 0 5px;
    }
    label:first-child { margin-top: 0; }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 10px 13px; font-size: 14px;
      border: 1.5px solid #ddd; border-radius: 8px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(21,101,192,.12);
    }
    input.error-input { border-color: var(--accent); }

    #error-msg {
      display: flex; align-items: center; gap: 6px;
      color: var(--accent); font-size: 13px;
      background: #fff5f5; border: 1px solid #ffcdd2;
      border-radius: 7px; padding: 8px 12px;
      margin-top: 12px; min-height: 36px;
    }
    #error-msg:empty { display: none; }

    .btn {
      width: 100%; padding: 11px; font-size: 15px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer;
      margin-top: 16px; letter-spacing: .3px;
      transition: background .2s, transform .1s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #0d47a1; }
    .btn-primary:active { transform: scale(.98); }

    /* Cart */
    #cart-empty {
      text-align: center; color: #aaa; padding: 28px 0;
      font-size: 14px; font-style: italic;
    }
    #cart-empty .big { font-size: 36px; display: block; margin-bottom: 6px; }

    #cart-list { list-style: none; }
    #cart-list li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-radius: 8px;
      background: #f8f9ff; border: 1px solid #e8eaf6;
      margin-bottom: 8px; font-size: 14px;
      animation: slideIn .25s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #cart-list li .dish-name { font-weight: 600; color: #333; }
    #cart-list li .qty-badge {
      background: var(--primary); color: #fff;
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      font-weight: 700;
    }
    #cart-count {
      background: #e8eaf6; color: var(--primary);
      font-size: 13px; font-weight: 700;
      padding: 6px 14px; border-radius: 20px;
      display: inline-block; margin-bottom: 14px;
    }
  </style>
</head>
<body>

<div class="banner">
  <div class="tag">M1-A1 · Section B · Task 3</div>
  <h1>Live Order Form — DOM + Events</h1>
  <p>Type a dish name and quantity, then click Add to Cart. Validated with inline error messages.</p>
</div>

<div class="container">

  <!-- Form Card -->
  <div class="card">
    <div class="card-head">
      <span class="icon">📝</span> Add Item to Cart
    </div>
    <div class="card-body">
      <!-- form element — demonstrates event.preventDefault() -->
      <form id="order-form" novalidate>
        <label for="dish-name">Dish Name</label>
        <input type="text" id="dish-name" placeholder="e.g. Paneer Tikka" autocomplete="off" />

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" placeholder="e.g. 2" min="1" />

        <!-- Inline error — NOT alert() -->
        <p id="error-msg"></p>

        <button type="submit" class="btn btn-primary">+ Add to Cart</button>
      </form>
    </div>
  </div>

  <!-- Cart Card -->
  <div class="card">
    <div class="card-head">
      <span class="icon">🛒</span> Your Cart
    </div>
    <div class="card-body">
      <div id="cart-count" style="display:none;"></div>
      <div id="cart-empty">
        <span class="big">🛒</span>
        Your cart is empty.<br>Add a dish to get started.
      </div>
      <ul id="cart-list"></ul>
    </div>
  </div>

</div>

<script>
  // ── Attach event using addEventListener — NO inline onclick ──────────────
  document.getElementById("order-form")
    .addEventListener("submit", function (event) {
      event.preventDefault();   // prevent page reload

      const dishInput  = document.getElementById("dish-name");
      const qtyInput   = document.getElementById("quantity");
      const errorEl    = document.getElementById("error-msg");
      const cartList   = document.getElementById("cart-list");
      const emptyEl    = document.getElementById("cart-empty");
      const countEl    = document.getElementById("cart-count");

      const dishName = dishInput.value.trim();
      const quantity = qtyInput.value.trim();

      // Reset styles
      dishInput.classList.remove("error-input");
      qtyInput.classList.remove("error-input");
      errorEl.textContent = "";

      // ── Validation ───────────────────────────────────────────────────────
      if (!dishName && !quantity) {
        errorEl.textContent = "⚠️  Please enter both dish name and quantity.";
        dishInput.classList.add("error-input");
        qtyInput.classList.add("error-input");
        return;
      }
      if (!dishName) {
        errorEl.textContent = "⚠️  Dish name cannot be empty.";
        dishInput.classList.add("error-input");
        return;
      }
      if (!quantity || Number(quantity) < 1) {
        errorEl.textContent = "⚠️  Please enter a valid quantity (minimum 1).";
        qtyInput.classList.add("error-input");
        return;
      }

      // ── Append <li> to cart <ul> ─────────────────────────────────────────
      emptyEl.style.display = "none";

      const li = document.createElement("li");
      li.innerHTML = `
        <span class="dish-name">${dishName}</span>
        <span class="qty-badge">x ${quantity}</span>
      `;
      cartList.appendChild(li);

      // Update cart count
      const count = cartList.querySelectorAll("li").length;
      countEl.style.display  = "inline-block";
      countEl.textContent    = `${count} item${count !== 1 ? "s" : ""} in cart`;

      // ── Clear inputs ─────────────────────────────────────────────────────
      dishInput.value = "";
      qtyInput.value  = "";
      dishInput.focus();
    });
</script>

</body>
</html>
