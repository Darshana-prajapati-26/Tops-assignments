<!--
  Q1 & Q2:
  Create an HTML page with a <div id="greeting"></div> and use getElementById in your
  script to set its innerHTML to 'Welcome to the IPL Fan Zone!'.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q1 & Q2 - getElementById greeting</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #0d47a1; color: #fff; }
    #greeting { font-size: 28px; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>

  <div id="greeting"></div>

  <script>
    // Q1 & Q2: Use getElementById to set innerHTML
    document.getElementById("greeting").innerHTML = "Welcome to the IPL Fan Zone!";
  </script>
</body>
</html>
