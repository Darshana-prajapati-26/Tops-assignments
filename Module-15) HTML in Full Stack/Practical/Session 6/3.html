<!--
  Q3:
  Create an HTML file with a <div id="greeting"></div> and use getElementById in a script
  to set its innerHTML to 'Hello, welcome to your playlist!'
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - getElementById playlist greeting</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #1DB954; color: #fff; }
    #greeting { font-size: 26px; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>

  <div id="greeting"></div>

  <script>
    // Q3: Use getElementById to set innerHTML for playlist welcome
    document.getElementById("greeting").innerHTML = "Hello, welcome to your playlist!";
  </script>
</body>
</html>
