<!--
  Q9:
  Add a feature to your cart UI so that when a new product card is added dynamically
  (for example, by clicking an 'Add Random Product' button), the 'X' remove functionality
  still works without adding any new event listeners.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q9 - Dynamic Cards: Remove Works Without New Listeners</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f5f5f5; }
    h2 { color: #2874f0; }
    .question-box {
      background: #fff8e1; border-left: 5px solid #f9a825;
      border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; max-width: 680px;
    }
    .question-box h3 { margin: 0 0 8px; color: #e65100; font-size: 15px; }
    .question-box p { margin: 0; font-size: 15px; line-height: 1.7; color: #333; }
    .add-btn {
      padding: 10px 22px; background: #388e3c; color: #fff; border: none;
      border-radius: 6px; font-size: 15px; cursor: pointer; margin-bottom: 18px;
    }
    .add-btn:hover { background: #2e7d32; }
    #cart { max-width: 480px; }
    .cart-card {
      background: #fff; border-radius: 10px; padding: 14px 18px; margin: 10px 0;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.09); animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .product-info { display: flex; flex-direction: column; gap: 3px; }
    .product-name { font-weight: bold; color: #212121; font-size: 15px; }
    .product-price { color: #388e3c; font-size: 14px; }
    .remove-btn {
      background: none; border: none; font-size: 20px; color: #aaa;
      cursor: pointer; padding: 4px 8px; border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }
    .remove-btn:hover { color: #e53935; background: #fdecea; }
    #counter { font-size: 13px; color: #888; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>Q9: Dynamic Cart – Remove Works Without New Listeners</h2>
  <div class="question-box">
    <h3>Q9</h3>
    <p>Add a feature to your cart UI so that when a new product card is added dynamically
    (by clicking 'Add Random Product'), the 'X' remove functionality still works without
    adding any new event listeners.</p>
  </div>

  <button class="add-btn" id="add-btn">+ Add Random Product</button>
  <div id="counter">Products in cart: <strong id="count">3</strong></div>

  <!-- ✅ Listener registered ONCE on #cart — works for all current and future cards -->
  <div id="cart"></div>

  <script>
    const products = [
      { name: "Redmi Note 12 Pro", price: 18999 },
      { name: "Noise Smartwatch", price: 3499 },
      { name: "Boat Rockerz 255", price: 1299 },
      { name: "Samsung Galaxy Tab", price: 32999 },
      { name: "HP Laptop 15s", price: 45999 },
      { name: "Apple AirPods Pro", price: 24990 },
      { name: "Logitech MX Mouse", price: 5499 },
      { name: "USB-C Hub", price: 899 }
    ];

    let nextIdx = 3;
    const cart = document.getElementById("cart");
    const countEl = document.getElementById("count");

    function createCard(product) {
      const card = document.createElement("div");
      card.classList.add("cart-card");
      card.innerHTML = `
        <div class="product-info">
          <span class="product-name">🛒 ${product.name}</span>
          <span class="product-price">₹${product.price.toLocaleString()}</span>
        </div>
        <button class="remove-btn" title="Remove">✕</button>
      `;
      return card;
    }

    function updateCount() {
      countEl.textContent = cart.children.length;
    }

    // Render first 3 products
    products.slice(0, 3).forEach(p => cart.appendChild(createCard(p)));

    // ✅ ONE listener — registered once, handles all removals (including future cards)
    cart.addEventListener("click", function (e) {
      if (e.target.classList.contains("remove-btn")) {
        e.target.closest(".cart-card").remove();
        updateCount();
      }
    });

    // Add random product — NO new listener added here
    document.getElementById("add-btn").addEventListener("click", function () {
      if (nextIdx >= products.length) {
        this.textContent = "No more products!";
        this.disabled = true;
        return;
      }
      cart.appendChild(createCard(products[nextIdx++]));
      updateCount();
    });
  </script>
</body>
</html>
